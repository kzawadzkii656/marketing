<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#086647"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Marketing sklepu</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"></head><body><header><div class="brand"><span class="logo">M</span><div>Marketing sklepu<small id="store-name">Twój plan ekspozycji</small></div></div><span id="connection" class="pill">Lokalnie</span></header><main id="app"><p>Uruchamianie aplikacji…</p></main><nav aria-label="Nawigacja"><button data-tab="today">Dzisiaj</button><button data-tab="plan">Plan</button><button data-tab="import">Import PDF</button><button data-tab="settings">Sklep</button></nav><dialog id="store-onboarding"><form id="store-onboarding-form"><h2>Numer sklepu</h2><p>Wpisz numer sklepu, aby rozpocząć. Aplikacja zapisze go na tym telefonie i połączy z dzienną statystyką korzystania.</p><label for="first-store-number">Numer sklepu<input id="first-store-number" name="storeNumber" inputmode="text" autocomplete="off" placeholder="np. Z001" pattern="[Zz]?[0-9]{3,8}" required></label><p id="store-onboarding-error" role="alert"></p><button type="submit" class="primary wide">Zapisz i rozpocznij</button></form></dialog><dialog id="viewer"><div class="dialog-head"><strong id="viewer-title">Materiał źródłowy</strong><button id="close-viewer">Zamknij</button></div><div id="pdf-page"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.mjs"></script></body></html>
